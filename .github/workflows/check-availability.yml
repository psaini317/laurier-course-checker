name: Check course availability

on:
  schedule:
    # Cron's minute field repeats every hour, so "every 45 min" can't be a
    # single expression (45 doesn't divide 60). These three lines form a
    # repeating 3-hour cycle — :07, :52, :37, :22, then :07 again 3h later —
    # landing exactly 45 minutes apart throughout, off the peak :00/:15/:30/:45
    # minutes other scheduled workflows tend to pile onto.
    - cron: "7,52 */3 * * *"
    - cron: "37 1-23/3 * * *"
    - cron: "22 2-23/3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: check-availability
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run check
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}

      - name: Commit updated state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "course-checker-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "Update seat availability state"
            git push
          fi
